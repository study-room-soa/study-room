services:
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${BOOKING_DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

volumes:
  booking-db-data:
