services:
  room-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROOM_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - room-db-data:/var/lib/postgresql/data

volumes:
  room-db-data:
