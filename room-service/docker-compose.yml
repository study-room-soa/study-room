services:
  room-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROOM_DB_NAME}
    volumes:
      - room-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ROOM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  room-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@room-db:5432/${ROOM_DB_NAME}
      REVIEW_SERVICE_URL: ${REVIEW_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      room-db:
        condition: service_healthy

volumes:
  room-db-data:
